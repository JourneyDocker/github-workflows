name: Docker Publish

# Build a Docker image and publish it to GHCR and/or DockerHub.
#
# Example caller:
#   jobs:
#     publish:
#       uses: JourneyDocker/github-workflows/.github/workflows/docker-publish.yml@main
#       with:
#         tag: main
#         platforms: linux/amd64
#         registry: github
#         context: .
#         file: deploy/Dockerfile

on:
  workflow_call:
    inputs:
      tag:
        description: "The tag for the Docker image"
        required: true
        type: string
      platforms:
        description: "The platforms for Docker image build, e.g., 'linux/amd64,linux/arm64'"
        required: true
        type: string
      registry:
        description: "The registry to publish to: 'both', 'dockerhub', or 'github'"
        required: false
        default: 'both'
        type: string
      context:
        description: "Build context directory, relative to the repository root"
        required: false
        default: '.'
        type: string
      file:
        description: "Path to the Dockerfile, relative to the build context"
        required: false
        default: 'Dockerfile'
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    environment: release-docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          show-progress: false
          submodules: recursive
          persist-credentials: false

      # Single source of truth: validates inputs and resolves registries,
      # image names, and the Docker build context/file for every later step.
      - name: Resolve configuration
        id: config
        shell: bash
        env:
          REGISTRY: ${{ inputs.registry }}
          CONTEXT: ${{ inputs.context }}
          FILE: ${{ inputs.file }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          # --- Registries ---------------------------------------------------
          case "$REGISTRY" in
            both)      ghcr=true;  dockerhub=true  ;;
            github)    ghcr=true;  dockerhub=false ;;
            dockerhub) ghcr=false; dockerhub=true  ;;
            *)
              echo "::error::Invalid 'registry' input '$REGISTRY'. Expected 'both', 'dockerhub', or 'github'."
              exit 1
              ;;
          esac

          if [ "$dockerhub" = true ] && { [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; }; then
            echo "::error::Publishing to DockerHub requires the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets."
            exit 1
          fi

          # --- Image names (Docker requires lowercase) ----------------------
          repo_name="${GITHUB_REPOSITORY#*/}"
          repo_name="${repo_name,,}"

          images=()
          dockerhub_repo=""
          if [ "$ghcr" = true ]; then
            images+=("ghcr.io/${GITHUB_REPOSITORY,,}")
          fi
          if [ "$dockerhub" = true ]; then
            dockerhub_repo="${DOCKERHUB_USERNAME,,}/${repo_name}"
            images+=("$dockerhub_repo")
          fi

          # --- Build context and Dockerfile ---------------------------------
          context="${CONTEXT%/}"
          context="${context:-.}"

          if [ ! -d "$context" ]; then
            echo "::error::Build context directory not found: '$context'."
            exit 1
          fi

          # 'file' is relative to the build context
          if [ "$context" = . ]; then
            file="$FILE"
          else
            file="$context/$FILE"
          fi

          if [ ! -f "$file" ]; then
            echo "::error::Dockerfile not found at '$file'."
            exit 1
          fi

          # --- Outputs ------------------------------------------------------
          {
            echo "ghcr=$ghcr"
            echo "dockerhub=$dockerhub"
            echo "dockerhub-repo=$dockerhub_repo"
            echo "package=$repo_name"
            echo "context=$context"
            echo "file=$file"
            echo "images<<EOF"
            printf '%s\n' "${images[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved context='$context' file='$file' images='${images[*]}'"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to ghcr.io
        if: ${{ steps.config.outputs.ghcr == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        if: ${{ steps.config.outputs.dockerhub == 'true' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.config.outputs.images }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=ref,event=branch,enable=${{ inputs.tag != 'main' }}
            type=ref,event=tag,enable=${{ inputs.tag != 'main' }}
            type=ref,event=pr,enable=${{ inputs.tag != 'main' }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.config.outputs.context }}
          file: ${{ steps.config.outputs.file }}
          platforms: ${{ inputs.platforms }}
          provenance: true
          sbom: true
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

      - name: Update DockerHub repository description
        if: ${{ steps.config.outputs.dockerhub == 'true' && inputs.tag == 'main' }}
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ steps.config.outputs.dockerhub-repo }}
          short-description: ${{ github.event.repository.description }}

      - name: Delete untagged packages
        if: ${{ steps.config.outputs.ghcr == 'true' }}
        uses: dataaxiom/ghcr-cleanup-action@v1
        continue-on-error: true
        with:
          delete-untagged: true
          delete-ghost-images: true
          delete-orphaned-images: true
          validate: true
          package: ${{ steps.config.outputs.package }}