name: Docker Publish

on:
  workflow_call:
    inputs:
      tag:
        description: "The tag for the Docker image"
        required: true
        type: string
      platforms:
        description: "The platforms for Docker image build, e.g., 'linux/amd64,linux/arm64'"
        required: true
        type: string
      registry:
        description: "The registry to publish to: 'both', 'dockerhub', or 'github'"
        required: false
        default: 'both'
        type: string
      dockerfile-location:
        description: "Build context directory or path to a Dockerfile, relative to the repository root. If a file path is given, its directory is used as context (e.g. 'docker/Dockerfile.prod')"
        required: false
        default: '.'
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    environment: release-docker
    runs-on: ubuntu-latest

    env:
      PUSH_GHCR: ${{ inputs.registry == 'both' || inputs.registry == 'github' }}
      PUSH_DOCKERHUB: ${{ inputs.registry == 'both' || inputs.registry == 'dockerhub' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          show-progress: false
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to ghcr.io
        if: ${{ env.PUSH_GHCR == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        if: ${{ env.PUSH_DOCKERHUB == 'true' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image names
        id: images
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -eu

          # Docker requires lowercase repository names
          repo_name="${GITHUB_REPOSITORY#*/}"
          repo_name="${repo_name,,}"

          images=()
          if [ "$PUSH_GHCR" = true ]; then
            images+=("ghcr.io/${GITHUB_REPOSITORY,,}")
          fi
          if [ "$PUSH_DOCKERHUB" = true ]; then
            images+=("${DOCKERHUB_USERNAME,,}/${repo_name}")
          fi

          if [ "${#images[@]}" -eq 0 ]; then
            echo "::error::Invalid 'registry' input. Expected 'both', 'dockerhub', or 'github'."
            exit 1
          fi

          {
            echo "package=${repo_name}"
            echo "dockerhub=${DOCKERHUB_USERNAME,,}/${repo_name}"
            echo "images<<EOF"
            printf '%s\n' "${images[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.images.outputs.images }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=ref,event=branch,enable=${{ inputs.tag != 'main' }}
            type=ref,event=tag,enable=${{ inputs.tag != 'main' }}
            type=ref,event=pr,enable=${{ inputs.tag != 'main' }}

      - name: Resolve Docker context and file
        id: docker-path
        shell: bash
        env:
          LOCATION: ${{ inputs.dockerfile-location }}
        run: |
          set -eu

          path="${LOCATION%/}"
          path="${path:-.}"

          is_file=false
          if [ -f "$path" ]; then
            is_file=true
          elif [ ! -d "$path" ]; then
            # Path doesn't exist (yet): infer from the file name
            case "$(basename "$path")" in
              Dockerfile*|*.Dockerfile|*.dockerfile) is_file=true ;;
            esac
          fi

          if [ "$is_file" = true ]; then
            context="$(dirname "$path")"
            file="$path"
          else
            context="$path"
            file="$path/Dockerfile"
          fi

          echo "context=$context" >> "$GITHUB_OUTPUT"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "Resolved context='$context' file='$file' from input='$LOCATION'"

      - name: Build and publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.docker-path.outputs.context }}
          file: ${{ steps.docker-path.outputs.file }}
          platforms: ${{ inputs.platforms }}
          provenance: true
          sbom: true
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

      - name: Update DockerHub repository description
        if: ${{ env.PUSH_DOCKERHUB == 'true' && inputs.tag == 'main' }}
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ steps.images.outputs.dockerhub }}
          short-description: ${{ github.event.repository.description }}

      - name: Delete untagged packages
        if: ${{ env.PUSH_GHCR == 'true' }}
        uses: dataaxiom/ghcr-cleanup-action@v1
        continue-on-error: true
        with:
          delete-untagged: true
          delete-ghost-images: true
          delete-orphaned-images: true
          validate: true
          package: ${{ steps.images.outputs.package }}